<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- The tab icon, drawn from the same parts as the header: the ink plate with its blue and plum
       corner glows, a gold price tag (the drawn twin of the 🏷️ the page carries), and the eight-band
       rarity rule under it. It has to survive a 16px tab, so the tag fills the plate and the rule is
       the only fine detail; the tag is tilted rather than upright, because an upright one reads as a
       house once the browser shrinks it. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171d2d"/>
      <stop offset="1" stop-color="#0a0d14"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.05" cy="-0.15" r="1">
      <stop offset="0" stop-color="#4b7bff" stop-opacity="0.36"/>
      <stop offset="0.62" stop-color="#4b7bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPlum" cx="1.05" cy="0.04" r="0.9">
      <stop offset="0" stop-color="#e457b1" stop-opacity="0.28"/>
      <stop offset="0.62" stop-color="#e457b1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tag" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffe08a"/>
      <stop offset="0.55" stop-color="#f7ce46"/>
      <stop offset="1" stop-color="#eab52a"/>
    </linearGradient>
    <linearGradient id="bands" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#aab2c0"/>
      <stop offset="0.14" stop-color="#eb4b4b"/>
      <stop offset="0.28" stop-color="#e457b1"/>
      <stop offset="0.42" stop-color="#a763ff"/>
      <stop offset="0.56" stop-color="#4b7bff"/>
      <stop offset="0.70" stop-color="#4fc3f7"/>
      <stop offset="0.84" stop-color="#f7ce46"/>
      <stop offset="1" stop-color="#64f5c8"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#plate)"/>
  <rect width="64" height="64" rx="14" fill="url(#glowBlue)"/>
  <rect width="64" height="64" rx="14" fill="url(#glowPlum)"/>
  <rect x="1.25" y="1.25" width="61.5" height="61.5" rx="13" fill="none" stroke="#26304a" stroke-width="2.5"/>

  <!-- Rotated, the tag's own centre stays put but its drawn bounding box does not: the point goes
       into the upper-left and the wide end to the lower-right, which lands the ink about 5 units
       right of the plate's centre and on top of the rule. The translate moves the finished shape
       back to the plate's optical middle, clear of the rule below it. -->
  <g transform="translate(-4 -5) rotate(-45 32 29)">
    <path d="M32 12 L46 26 V42 A4 4 0 0 1 42 46 H22 A4 4 0 0 1 18 42 V26 Z"
          fill="url(#tag)" stroke="url(#tag)" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="32" cy="24" r="4.6" fill="#121620"/>
  </g>

  <rect x="12" y="53" width="40" height="3.5" rx="1.75" fill="url(#bands)" opacity="0.95"/>
</svg>
